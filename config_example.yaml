# 桌面宠物配置文件

api:
  base_url: "https://api.openai.com/v1"
  api_key: "your-api-key-here"
  model: "gpt-4o-mini"
  max_tokens: 2048

chat:
  context_limit: 128000
  compress_threshold: 0.8
  temperature: 0.7

persona:
  name: "皮卡丘"
  duties: ""  # 用户自定义主要职责，如: "陪伴用户、提醒休息、聊天解闷"
  # 用户画像（多维度）
  user_profile:
    daily_details: ""       # 日常细节：作息习惯、兴趣爱好、消费偏好等
    emotional_response: ""  # 情绪反应：情绪表达方式、压力反应、情感需求等
    value_choices: ""       # 价值选择：人生优先级、决策倾向、道德观念等
    social_circle: ""       # 社交圈层：社交频率、人际关系、沟通风格等
    adversity_response: ""  # 逆境应对：面对困难的态度、应对策略、恢复能力等
    cognitive_pattern: ""   # 认知格局：思维模式、学习方式、决策风格等
    solitude_state: ""      # 独处状态：独处习惯、内心对话、自我认知等

# 技能配置
skills:
  enabled: true
  directory: "skills"  # skills 目录路径

ui:
  pet_size: 100
  chat_window_size: "medium"  # small/medium/large
  dialog_interval: 5000

# 状态配置 - 可自定义不同状态的动图和对话
states:
  # 待机状态（支持多个动图和对话，随机切换）
  idle:
    animations: []  # 留空则使用 assets/pikaqiu/ 目录下的所有 gif
    dialogs: []     # 留空则使用 assets/dialog.txt 文件

  # 点击状态
  click:
    animation: "assets/click/click.gif"
    dialog: "⚡ 别戳我！"

  # 拖拽状态
  drag:
    animation: ""
    dialog: "✋ 带我飞~"

  # 休息提醒状态
  rest:
    animation: ""
    dialog: "⏰ 该休息啦！"

history:
  auto_save: true
  file: "data/chat_history.json"